name: 更新公開內容
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 驗證發布程式
        run: python3 -m unittest test_publish.py
      - name: 取得已公開內容
        run: python3 publish.py
      - name: 記錄內容更新
        id: sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html writing-assistant.md writing-assistant.txt README.md publication.json robots.txt sitemap.xml .nojekyll favicon.svg
          if ! git diff --cached --quiet; then
            git commit -m '確認公開內容與來源同步'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: 準備閱讀網頁
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p _site
          cp index.html reader.css writing-assistant.txt favicon.svg robots.txt sitemap.xml publication.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
